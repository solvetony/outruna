# Include inside the HTTPS server. Run an independent Mainnet query service on 127.0.0.1:18099.
location = /rpc/tari/witness/get_tip_info {
    limit_except GET { deny all; }
    if ($args != "") { return 400; }
    proxy_pass http://127.0.0.1:18099/get_tip_info;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Referer "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_buffering off;
}

location = /rpc/tari/witness/get_header_by_height {
    limit_except GET { deny all; }
    if ($args !~ "^height=[0-9]{1,16}$") { return 400; }
    proxy_pass http://127.0.0.1:18099/get_header_by_height;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Referer "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_buffering off;
}

location = /rpc/tari/mainnet/json_rpc {
    limit_except POST { deny all; }
    client_max_body_size 2m;
    proxy_pass https://rpc.tari.com/json_rpc;
    proxy_ssl_server_name on;
    proxy_ssl_name rpc.tari.com;
    proxy_set_header Host rpc.tari.com;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Referer "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
}
