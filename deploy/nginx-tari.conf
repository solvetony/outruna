# Include inside the HTTPS server. Reads go directly to https://rpc.tari.com;
# this fixed route exists because the browser cannot submit JSON-RPC cross-origin.
location = /rpc/tari/mainnet/json_rpc {
    limit_except POST { deny all; }
    client_max_body_size 2m;
    proxy_pass https://rpc.tari.com/json_rpc;
    proxy_ssl_server_name on;
    proxy_ssl_name rpc.tari.com;
    proxy_set_header Host rpc.tari.com;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Referer "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
}
